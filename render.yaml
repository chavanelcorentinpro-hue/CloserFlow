services:
  - type: web
    name: closerflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile.production
    plan: free
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLOSERFLOW_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
